services:
  postgres:
    image: postgres:16-alpine
    container_name: brfhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brfhub
    ports:
      - '5433:5432'
    volumes:
      - brfhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brfhub']
      interval: 2s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: brfhub-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brfhub_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brfhub_test']
      interval: 2s
      timeout: 5s
      retries: 10

  # Catches every mail the server sends in dev, shown at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: brfhub-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  brfhub_pg_data:
