name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run it makes stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    name: core, app, web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The test database, as npm run db:up starts it locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brfhub_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brfhub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
